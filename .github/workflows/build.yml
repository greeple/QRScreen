name: Build QR Screen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/QRScreen.exe dist/QRScreen.exe
          Copy-Item README.md dist/README.txt
          Copy-Item LICENSE dist/LICENSE.txt
          New-Item -ItemType Directory -Force -Path dist/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item THIRD_PARTY_LICENSES/ZXing-Apache-2.0.txt dist/THIRD_PARTY_LICENSES/ZXing-Apache-2.0.txt
          Compress-Archive -Path dist/* -DestinationPath QRScreen-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRScreen-Windows-x64
          path: QRScreen-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QRScreen-Windows-x64.zip
          generate_release_notes: true
